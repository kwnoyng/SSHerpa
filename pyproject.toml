[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[project]
name = "ssherpa"
# 버전은 ssherpa/__init__.py 하나에만 적는다. 두 군데 적으면 릴리스 때
# 한쪽만 올라가고, PyPI 는 새 버전인데 `ssherpa --version` 은 옛 버전을
# 말하는 상태가 된다 — 사용자가 엉뚱한 버전으로 버그를 신고하게 된다.
dynamic = ["version"]
description = "Build lab environments on on-premises servers"
readme = "README.md"
requires-python = ">=3.9"
license = "Apache-2.0"
license-files = ["LICENSE"]
dependencies = [
    "typer>=0.12",
    "rich>=13",
    "PyYAML>=6",
    "questionary>=2",
]

[project.urls]
Homepage = "https://github.com/kwnoyng/SSHerpa"
Issues = "https://github.com/kwnoyng/SSHerpa/issues"

[project.optional-dependencies]
dev = ["pytest>=8", "ruff>=0.6"]

[project.scripts]
ssherpa = "ssherpa.cli:app"

[tool.hatch.version]
path = "ssherpa/__init__.py"

[tool.hatch.build.targets.wheel]
packages = ["ssherpa"]

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100

[tool.ruff.lint]
select = ["F", "E", "I", "UP", "B", "SIM", "ARG"]

[tool.ruff.lint.flake8-bugbear]
# typer 는 이 자리의 값을 호출 시점에 실제 인자로 바꿔치기한다. 호출 사이에
# 공유되는 가변 기본값이 아니라서 B008 이 경고하려는 상황이 아니다.
extend-immutable-calls = ["typer.Option", "typer.Argument"]
